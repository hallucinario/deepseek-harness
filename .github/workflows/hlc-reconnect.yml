name: HLC reconnect

on:
  pull_request:
    branches: [hallucinario]
  push:
    branches: [hallucinario]

permissions:
  contents: read

concurrency:
  group: hlc-reconnect-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reconnect:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DSH_TELEMETRY_DISABLED: '1'
      DSH_SNAPSHOT: replay
      DSH_GATE_CONCURRENCY: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v5.0.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          cache: pnpm
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.6'
      - run: pnpm install --frozen-lockfile
      - name: Reconnect lifetime regressions
        run: >-
          pnpm exec vitest run
          scripts/ci-workflow.spec.ts
          packages/client/ui-conversation/tests/apply-inject.client.spec.tsx
          packages/client/ui-sidebar-right/tests/session-views.client.spec.ts
          packages/extensions/cordis-client-runner/tests/plugin.client.spec.ts
          packages/extensions/cordis-client-runner/tests/inspect-registry.client.spec.ts
      - run: pnpm run build:artifacts
      - run: pnpm run build:check
      - name: MyDot account isolation and no-send regressions
        run: >-
          pnpm exec vitest run
          packages/experimental/mydot-integration-broker/tests
          packages/experimental/mydot-integrations/tests
      - name: MyDot private Unix execution transport
        run: >-
          pnpm run test:e2e
          packages/experimental/mydot-integrations/tests/unix-transport.e2e.ts
          --retry=0
      - name: MyDot keyless recorded Session
        run: >-
          pnpm run test:snapshot snapshots/session/headless.snapshot.ts
          -t 'mydot-no-send'
      - name: Experience memory and current context regressions
        run: >-
          pnpm exec vitest run
          packages/experimental/memory-experience/tests
          packages/core/agent-loop/tests
          packages/core/system-prompt/tests
          packages/compaction/compaction-basic/tests
          packages/llm/llm/tests
          --coverage
          --coverage.include='packages/experimental/memory-experience/src/**/*.ts'
          --coverage.include='packages/core/agent-loop/src/runtime-context.ts'
      - run: pnpm run doc-sync
      - name: Keyless SDK current context lifetime
        run: >-
          pnpm run test:snapshot snapshots/sdk/sdk.snapshot.ts
          -t 'current-context'
      - name: Python SDK current context projection
        run: >-
          uv run --frozen --group test --project python/sdk python -m pytest
          python/sdk/tests/test_current_context_snapshot.py
      - run: pnpm --dir apps/web exec playwright install --with-deps chromium webkit
      - name: Prepare bubblewrap (unrestrict userns)
        run: bash scripts/prepare-ci-bubblewrap.sh
      - name: Built experience memory capture, recall and retirement
        run: >-
          pnpm run test:e2e apps/cli/tests/profiles/sdk/memory-experience.e2e.ts
          --retry=0
      - name: Keyless Host restart and saved Session recovery
        run: >-
          pnpm exec vitest run --config vitest.web.config.ts
          apps/web/tests/server-restart.e2e.ts
          apps/web/tests/session-replay-reload.e2e.ts
